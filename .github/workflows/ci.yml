name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (unit + integration + golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        # e2e tests are skipped automatically (no EEP_BASE_URL); unit/integration/golden run.
        run: pytest -q

  build-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build EEP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/eep.Dockerfile
          push: false
      - name: Build measurements image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/measurements.Dockerfile
          push: false
      - name: Build reporting image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/reporting.Dockerfile
          push: false

  push-ecr:
    name: Push images to ECR (main only)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    # Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or an OIDC role) + AWS_REGION.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build + push (eep, measurements, reporting)
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          for svc in eep measurements reporting; do
            docker build --platform linux/amd64 -f "deployment/docker/${svc}.Dockerfile" \
              -t "$REG/mri-${svc}:${GITHUB_SHA::8}" -t "$REG/mri-${svc}:latest" .
            docker push "$REG/mri-${svc}:${GITHUB_SHA::8}"
            docker push "$REG/mri-${svc}:latest"
          done
