name: MLOps validation gate

# Evaluates the current threshold version on the golden cohort, tracks the run in MLflow, and
# fails (blocks "promotion") if the metric gate is not met. See mlops/validate.py + docs/mlops.md.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Evaluate + track + promotion gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-mlops.txt
      - name: Run validation gate (tracks to MLflow SQLite, exits non-zero if blocked)
        run: python -m mlops.validate
      - name: Upload MLflow tracking DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: mlflow.db
          if-no-files-found: ignore
